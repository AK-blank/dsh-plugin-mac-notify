url: https://github.com/AK-blank/dsh-plugin-mac-notify
name: AK-blank/dsh-plugin-mac-notify
category: notify
description:
  en: Sends a macOS Notification Center alert when a session finishes or the agent is blocked on an answer, an approval, or an error. The banner carries the last reply and your system alert sound; clicking it brings the browser tab already showing DSH back to the front.
  zh: 会话结束、或 Agent 卡在等你回答／批准／排错时，发一条 macOS 系统通知；横幅带上最后一条回复与你的系统提示音，点击即可切回已打开 DSH 的浏览器标签页。
